[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "uniti-editor"
version = "0.1a16"
description = "UNITI — Unicode Intelligent Text Interchange"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "regex==2026.5.9",
]

[project.scripts]
uniti = "uniti.app.application:main"

[project.optional-dependencies]
ui = ["PySide6>=6.8"]
dev = ["pytest>=9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
